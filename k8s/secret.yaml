apiVersion: v1
kind: Secret
metadata:
  name: mlops-api-secret
  namespace: mlops
type: Opaque
stringData:
  # Replace in production. Used when loading models from a remote MLflow server.
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  GROQ_API_KEY: "REPLACE_WITH_BASE64_OR_STRING"
  GROQ_MODEL: "llama-3.1-8b-instant"
